# nonk8s
apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo-theme-chirpy-setting
spec:
  forms:
    - group: basics
      label: 全局设置
      formSchema:
        - $formkit: radio
          name: enable_site_info
          label: 站点信息开关
          value: false
          help: 右侧侧栏下方是否显示站点信息(halo中定义的页脚)
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
        - $formkit: text
          name: copyrightAgreement
          label: 版权协议
          value: "CC BY 4.0"
        - $formkit: url
          name: copyrightAgreementUrl
          label: 版权协议地址
          placeholder: 请输入版权协议地址
          value: "https://creativecommons.org/licenses/by/4.0/"
        - $formkit: text
          name: footerCopyrightAgreement
          label: 页脚版权协议
          value: "Except where otherwise noted, the blog posts on this site are licensed under the Creative Commons Attribution 4.0 International (CC BY 4.0) License by the author."
          help: 页脚 "All rights reserved" 浮现时显示的版权协议

    - group: sidebar
      label: 侧栏
      formSchema:
        - $formkit: repeater
          name: socials
          label: 社交链接
          value:
            - icon: fab fa-github
              url: https://github.com/airbozh
            - icon: fab fa-twitter
              url: https://twitter.com/
            - icon: fas fa-envelope
              url: mailto:i@airbozh.cn
            - icon: fas fa-rss
              url: /feed.xml
          max: 5
          children:
            - $formkit: text
              name: icon
              label: 图标
              value: ""
              required: true
            - $formkit: text
              name: url
              label: 链接
              value: ""
              required: true

    - group: toc
      label: 目录 (TOC)
      formSchema:
        - $formkit: select
          name: startLevel
          label: 起始标题层级
          value: 2
          help: 目录从该标题层级开始显示。若文章以 H1 组织内容，可设为 H1。
          options:
            - label: "H1"
              value: 1
            - label: "H2"
              value: 2
            - label: "H3"
              value: 3
            - label: "H4"
              value: 4
            - label: "H5"
              value: 5
            - label: "H6"
              value: 6
        - $formkit: select
          name: endLevel
          label: 结束标题层级
          value: 4
          help: 目录显示到该标题层级为止（需大于等于起始层级）。
          options:
            - label: "H1"
              value: 1
            - label: "H2"
              value: 2
            - label: "H3"
              value: 3
            - label: "H4"
              value: 4
            - label: "H5"
              value: 5
            - label: "H6"
              value: 6
        - $formkit: select
          name: collapseDepth
          label: 折叠层级
          value: 6
          help: 目录保持展开的层级数；更深的子标题会被折叠，滚动到对应区域时自动展开。设为「全部展开」则不折叠。
          options:
            - label: "1 级"
              value: 1
            - label: "2 级"
              value: 2
            - label: "3 级"
              value: 3
            - label: "4 级"
              value: 4
            - label: "5 级"
              value: 5
            - label: "全部展开（不折叠）"
              value: 6

    - group: post
      label: 文章
      formSchema:
        - $formkit: repeater
          name: share
          label: 分享设置
          value:
            - name: Telegram
              icon: fa-fw fab fa-telegram
              url: https://t.me/share/url?url=@URL
            - name: Facebook
              icon: fa-fw fab fa-facebook-square
              url: https://www.facebook.com/sharer/sharer.php?u=@URL
            - name: Twitter
              icon: fa-fw fa-brands fa-square-x-twitter
              url: https://twitter.com/intent/tweet?&url=@URL
          max: 5
          children:
            - $formkit: text
              name: name
              label: 名称
              value: ""
              required: true
            - $formkit: text
              name: icon
              label: 图标
              value: ""
              required: true
            - $formkit: text
              name: url
              label: 链接
              value: ""
              required: true
